name: Rust

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Run Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings
    - name: Verify generated CSS
      run: |
        npm ci
        export PATH="$PWD/node_modules/.bin:$PATH"
        make css-prod
        git diff --exit-code -- static/style.css
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --all-targets --all-features --locked --verbose

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - name: Generate CSS
      run: |
        npm ci
        export PATH="$PWD/node_modules/.bin:$PATH"
        make css-prod
    - name: Build release
      run: cargo build --release --locked --verbose
    - name: Package release
      run: |
        mkdir -p release/factorio-browser
        cp target/release/factorio-browser release/factorio-browser/
        cp -r static release/factorio-browser/
        tar -czvf factorio-browser-linux-x86_64.tar.gz -C release factorio-browser
    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: factorio-browser-linux-x86_64
        path: factorio-browser-linux-x86_64.tar.gz
    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: factorio-browser-linux-x86_64.tar.gz
        generate_release_notes: true
